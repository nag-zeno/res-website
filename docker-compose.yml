services:
  postgres:
    image: postgres:16
    container_name: speakeasy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: speakeasy
    ports:
      - "5432:5432"
    volumes:
      - speakeasy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  speakeasy_pg:
